# Workflow for the Test C sandbox repository (copy to .github/workflows/ci.yml in the sandbox, by hand).
# No third-party actions: the commit is fetched with plain git (public repository, no token), and the tests run
# on the runner's preinstalled Node. The job name below is the required check name (ci-test).
name: ci
on:
  push:
    branches: ['agent/**', 'main']
permissions:
  contents: read
jobs:
  test:
    name: ci-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: test
        working-directory: src
        run: |
          node --version
          # fail if there is nothing to test: a green run with zero tests would prove nothing
          ls test/*.test.js >/dev/null 2>&1 || { echo "no test files under test/"; exit 1; }
          node --test 'test/**/*.test.js'
